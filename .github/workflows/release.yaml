name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - name: Set release VERSION
        run: echo "VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ env.VERSION }}
      - name: Notify GChat
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GCHAT_WEBHOOK: ${{ secrets.GCHAT_RELEASE_WEBHOOK }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          RELEASE=$(gh api repos/${{ github.repository }}/releases/tags/$TAG)
          URL=$(echo "$RELEASE" | jq -r '.html_url')
          AUTHOR=$(echo "$RELEASE" | jq -r '.author.login')
          BODY=$(echo "$RELEASE" | jq -r '.body' \
            | tr -d '\r' \
            | sed 's/^## \(.*\)$/\*\1\*/' \
            | sed 's/^### \(.*\)$/\*\1\*/' \
            | sed 's/\*\*\([^*]*\)\*\*/\*\1\*/' \
            | sed 's/^\* /• /' \
            | sed 's/^- /• /')
          printf '%s' "🚀 *A new release was published:*
*${{ github.repository }}* ${TAG} — ${URL}
${BODY}
Released by @${AUTHOR}" \
            | jq -Rs '{"text": .}' \
            | curl -s -X POST "$GCHAT_WEBHOOK" \
              -H 'Content-Type: application/json' \
              -d @-
